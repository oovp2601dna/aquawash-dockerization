
services:
  app:
    build: .
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_NAME: laundry_db
      DB_USER: root
      DB_PASSWORD: local_dev_password
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: local_dev_password
      MYSQL_DATABASE: laundry_db
    volumes:
      - mysql_data:/var/lib/mysql
      - ./setup.sql:/docker-entrypoint-initdb.d/01-setup.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-plocal_dev_password"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data: